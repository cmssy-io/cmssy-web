query PublicSiteConfig($workspaceSlug: String!) {
  public {
    siteConfig(workspaceSlug: $workspaceSlug) {
      siteName
      defaultLanguage
      enabledLanguages
      notFoundPageId
      branding {
        brandName
        logoUrl
        logoDarkUrl
        faviconUrl
        ogImageUrl
      }
    }
  }
}
