name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # The vendored operations come from the CLI, the app's reads come from the
      # runtime packages. Nothing ties their versions together - the CLI carries
      # its own nested @cmssy/core - so bumping one and not the other leaves the
      # check below comparing against a version the app no longer runs, and
      # passing.
      - name: The CLI and the runtime SDK are the same version
        run: |
          set -euo pipefail
          version() {
            node -p "JSON.parse(require('fs').readFileSync('node_modules/@cmssy/$1/package.json','utf8')).version"
          }
          cli=$(version cli)
          core=$(version core)
          if [ "$cli" != "$core" ]; then
            echo "::error::@cmssy/cli $cli writes the operations, the app runs @cmssy/core $core - bump both"
            exit 1
          fi
          echo "both on $cli"

      # Models go to a throwaway path on purpose. graphql/models.ts has no
      # consumer here, and gating on it would let anyone editing a model in the
      # CMS turn every open pull request red.
      #
      # The assertion itself is offline - the operations come from the CLI's own
      # bundle - but the command still fetches models it discards, so it can
      # fail on an API outage. The file is judged first so staleness reports
      # itself either way, then the command's own failure is re-raised: `|| true`
      # would still catch a stale file, and would silently swallow the outage and
      # anything failing before the write, like a name collision.
      - name: The vendored operations match the SDK
        env:
          CMSSY_ORG_SLUG: cmssy
          CMSSY_WORKSPACE_SLUG: cmssy
        run: |
          set -euo pipefail
          exit_code=0
          pnpm cmssy types --out "$RUNNER_TEMP/models.ts" || exit_code=$?
          if [ -n "$(git status --porcelain -- cmssy/operations.graphql)" ]; then
            # status, not diff: diff prints nothing when the file is untracked,
            # which is the case this check exists to survive.
            git status --short -- cmssy/operations.graphql
            echo "::error::run pnpm types and commit cmssy/operations.graphql"
            exit 1
          fi
          exit $exit_code

      # The app sends the documents in graphql/generated, not the .graphql files
      # the step above compares. Without this an SDK bump rewrites
      # operations.graphql, CI goes green, and the app keeps sending the
      # previous selection set.
      #
      # This reads the live schema, so a backend deploy that changes an enum
      # lands here too - the committed output really is stale then, whoever
      # caused it.
      - name: Generated documents are up to date
        run: |
          set -euo pipefail
          pnpm codegen
          if [ -n "$(git status --porcelain -- graphql/generated)" ]; then
            git status --short -- graphql/generated
            echo "::error::graphql/generated is stale - run pnpm codegen and commit it. If you changed no documents, the production schema moved."
            exit 1
          fi

  # This site declared `revalidate = 3600` for the whole of v10 and served
  # `no-store` on every request: a catch-all that generates no params is
  # rendered on demand, and the only warning was a blank Revalidate column in
  # the build output. Nothing here read a header, so nothing noticed.
  #
  # No secrets: the delivery API serves published content by workspace slug.
  cache:
    runs-on: ubuntu-latest
    env:
      CMSSY_ORG_SLUG: cmssy
      CMSSY_WORKSPACE_SLUG: cmssy
      NEXT_PUBLIC_CMSSY_WORKSPACE_ID: 695a526b09373a29a6c4a082
      NEXT_PUBLIC_SITE_URL: https://www.cmssy.com
      CMSSY_DRAFT_SECRET: ci-placeholder-draft-secret
      CMSSY_REVALIDATE_SECRET: ci-placeholder-revalidate-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: The pages must be prerendered and cacheable
        run: |
          set -euo pipefail
          pnpm start -p 3000 &
          npx --yes wait-on http://localhost:3000/ --timeout 90000

          root=$(curl -sI http://localhost:3000/)
          echo "$root"

          if ! grep -qi "^x-nextjs-prerender: 1" <<<"$root"; then
            echo "FAILED: / is rendered on demand. Either generateStaticParams" \
                 "is gone, or something in the route reads a dynamic API -" \
                 "headers(), cookies(), searchParams, or a fetch with" \
                 "cache: \"no-store\"."
            exit 1
          fi

          if ! grep -qiE "^cache-control:.*s-maxage=[0-9]+" <<<"$root"; then
            echo "FAILED: / carries no s-maxage - nothing downstream caches it."
            exit 1
          fi

          # An on-demand path: MISS then HIT. Asserting on a prerendered path
          # proves nothing, its first request is already a HIT.
          uncached="/ci-cache-probe-$(date +%s)"
          first=$(curl -sI "http://localhost:3000$uncached" | grep -i "^x-nextjs-cache:" || true)
          second=$(curl -sI "http://localhost:3000$uncached" | grep -i "^x-nextjs-cache:" || true)
          echo "on-demand path: $first -> $second"

          if ! grep -qi "MISS" <<<"$first"; then
            echo "FAILED: expected MISS first, got '$first' - the check below" \
                 "would pass vacuously."
            exit 1
          fi

          if ! grep -qi "HIT" <<<"$second"; then
            echo "FAILED: an on-demand path is re-rendered every request."
            exit 1
          fi

          echo "Route cache check passed."
