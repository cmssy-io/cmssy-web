name: Sync block manifest

on:
  deployment_status:

concurrency:
  group: sync-block-manifest
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    env:
      CMSSY_ORG_SLUG: cmssy
      CMSSY_WORKSPACE_SLUG: cmssy
      CMSSY_API_TOKEN: ${{ secrets.CMSSY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Push the deployed blocks to the workspace manifest
        run: pnpm cmssy sync-manifest --config cmssy/config.ts
